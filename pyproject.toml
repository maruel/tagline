# Project and tooling configuration for agents-file-index.
[project]
name = "agents-file-index"
version = "0.1.0"
description = "Maintains generated file indexes in AGENTS.md files."
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pylint."messages control"]
disable = [
  "line-too-long",
  "missing-module-docstring",
  "too-many-arguments",
  "too-many-branches",
  "too-many-locals",
  "too-many-positional-arguments",
  "too-many-return-statements",
  "too-many-statements",
]
