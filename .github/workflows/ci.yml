# Verify agents-file-index code quality and generated indexes.
name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check .
      - name: Install Pylint
        run: python -m pip install --disable-pip-version-check pylint==4.0.7
      - run: pylint .
      - run: python update_agents_file_index.py --check
